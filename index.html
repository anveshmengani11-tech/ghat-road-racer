<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- SEO: this is what Google shows in search results. Edit title and description to match your game name. -->
<title>Ghat Road Racer – Free Online Motorcycle and Car Racing Game</title>
<meta name="description" content="Play Ghat Road Racer free in your browser. Race bikes and cars through busy highway traffic, overtake autos and buses, clear levels and unlock new vehicles.">
<meta property="og:title" content="Ghat Road Racer – Free Racing Game">
<meta property="og:description" content="Overtake traffic, clear levels, unlock new bikes and cars. Play free on your phone.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
/* ---------- Colors (change here to re-theme the whole game) ---------- */
:root{--bg:#120f24;--road:#1c1838;--ink:#f4efe6;--amber:#ffb627;--pink:#ff3d7f;--muted:#8d86b3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bungee","Impact","Arial Black",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;max-height:780px;aspect-ratio:9/16;max-width:100%}
canvas{width:100%;height:100%;display:block;background:var(--road);border-radius:12px}
.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:18px;pointer-events:none;text-shadow:0 2px 0 #0008}
.hud small{display:block;font-size:11px;color:var(--muted)}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#120f24e6;border-radius:12px;text-align:center;padding:20px}
#panel h1{margin:0;font-size:38px;line-height:1.05;color:var(--amber);text-shadow:3px 3px 0 var(--pink)}
#panel p{margin:0;font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);max-width:270px;line-height:1.4}
#garage{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:290px}
.veh{font-size:12px;padding:10px 6px;background:#2a2450;color:var(--ink);border:2px solid transparent;border-radius:10px;line-height:1.3}
.veh small{display:block;font-family:system-ui,sans-serif;font-size:11px;color:var(--muted)}
.veh.on{border-color:var(--amber)}
.veh:disabled{opacity:.45}
button{font:inherit;cursor:pointer}
#go{font-size:20px;background:var(--amber);color:#1a1230;border:0;border-radius:10px;padding:14px 32px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="640" aria-label="Racing game"></canvas>
<div class="hud"><div><small>Score</small><span id="sc">0</span></div><div style="text-align:center"><small>Level</small><span id="lv">1</span></div><div style="text-align:right"><small>Best</small><span id="bs">0</span></div></div>
<div id="panel">
<h1 id="t">Ghat Road Racer</h1>
<p id="m">Race each level to the finish line. Overtake traffic for points. Tap the left or right side of the screen (or use the arrow keys) to change lanes.</p>
<div id="garage"></div>
<button id="go">Start level 1</button>
</div>
</div>
<noscript>Ghat Road Racer is a free racing game. Please turn on JavaScript to play.</noscript>
<script>
(function(){
"use strict";

/* ================= 1. SETTINGS ================= */
var NAME='Ghat Road Racer';              // game name (also change <title> above)
var W=360,H=640;                         // canvas size in game pixels
var LANES=4, RW=300, RX=(W-RW)/2, LW=RW/LANES; // road: 4 lanes, 300px wide
var BY=H-130;                            // y position of the player vehicle
var PXM=15;                              // game pixels per metre
var cv=document.getElementById('c'), ctx=cv.getContext('2d');

/* Original vehicle designs (not real brand names, so no trademark problems).
   need = level you must reach to unlock it. hw = half width for crash check. */
var VEHICLES=[
 {name:'Stallion 350', kind:'bike', need:1, color:'#2f9e6b', hw:13, note:'Classic cruiser'},
 {name:'Roadster 350', kind:'bike', need:2, color:'#e63946', hw:13, note:'Sharp and fast'},
 {name:'City Sedan',   kind:'car',  need:3, color:'#4cc9f0', hw:19, note:'Small family car'},
 {name:'Sport GT',     kind:'car',  need:5, color:'#9b5de5', hw:19, note:'Luxury speed'}
];

/* Traffic types. w/h = size, slow = speed factor (bigger = faster). */
var TRAFFIC=[
 {kind:'car', w:40, h:76,  slow:[0.35,0.6],  weight:70},
 {kind:'auto',w:32, h:56,  slow:[0.25,0.45], weight:18},  // three-wheeler auto
 {kind:'bus', w:46, h:130, slow:[0.2,0.35],  weight:12}
];
var CARCOLORS=['#ff3d7f','#4cc9f0','#9b5de5','#f15bb5','#00f5d4'];

/* ================= 2. SAVED PROGRESS ================= */
var best=0, unlocked=1, chosen=0;
try{
 best=+localStorage.getItem('grr-best')||0;
 unlocked=+localStorage.getItem('grr-lvl')||1;
 chosen=+localStorage.getItem('grr-veh')||0;
}catch(e){}
function save(){try{
 localStorage.setItem('grr-best',best);localStorage.setItem('grr-lvl',unlocked);localStorage.setItem('grr-veh',chosen);
}catch(e){}}

/* ================= 3. GAME STATE ================= */
var LVL=unlocked, total=0, running=false, nextLvl=unlocked;
var lane,px,lean,cars,speed,dist,pts,spawnT,off,pops,combo;
var panel=document.getElementById('panel'), sc=document.getElementById('sc'),
    bs=document.getElementById('bs'), lv=document.getElementById('lv'), go=document.getElementById('go'),
    garage=document.getElementById('garage');
bs.textContent=best;

function laneX(l){return RX+LW*l+LW/2}          // centre x of a lane
function trackLen(l){return 1000+500*(l-1)}      // level 1 = 1000 m, +500 m each level
function cur(){return VEHICLES[chosen]}

function reset(){                                // start a fresh attempt of a level
 lane=1;px=laneX(1);lean=0;cars=[];speed=4;dist=0;pts=0;spawnT=0;off=0;pops=[];combo=0;
}
function startLevel(l){LVL=l;lv.textContent=l;reset();running=true;panel.style.display='none'}
function show(title,msg,btn){                    // show the menu panel
 document.getElementById('t').textContent=title;
 document.getElementById('m').textContent=msg;
 go.textContent=btn;buildGarage();panel.style.display='flex';
}
function crash(){                                // player hit traffic
 running=false;total=0;nextLvl=LVL;
 show('Crashed','Stopped at '+Math.floor(dist/PXM)+' m of '+trackLen(LVL)+' m. You scored '+pts+' points.','Retry level '+LVL);
}
function win(){                                  // player reached the finish line
 running=false;total+=pts;
 if(total>best){best=total;bs.textContent=best}
 unlocked=Math.max(unlocked,LVL+1);save();nextLvl=LVL+1;
 var nv=VEHICLES.filter(function(v){return v.need===nextLvl})[0];
 show('Level '+LVL+' clear','Level points '+pts+'. Run total '+total+'.'+(nv?' New vehicle unlocked: '+nv.name+'!':''),'Start level '+nextLvl);
}

/* ================= 4. GARAGE (vehicle picker) ================= */
function buildGarage(){
 garage.innerHTML='';
 VEHICLES.forEach(function(v,i){
  var b=document.createElement('button');
  b.className='veh'+(i===chosen?' on':'');
  var ok=unlocked>=v.need;
  b.disabled=!ok;
  b.innerHTML=v.name+'<small>'+(ok?v.note:'Unlocks at level '+v.need)+'</small>';
  b.addEventListener('click',function(){chosen=i;save();buildGarage()});
  garage.appendChild(b);
 });
}

/* ================= 5. CONTROLS ================= */
go.addEventListener('click',function(){startLevel(nextLvl)});
function move(d){if(running)lane=Math.max(0,Math.min(LANES-1,lane+d))}
addEventListener('keydown',function(e){
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);
 else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);
 else if((e.key==='Enter'||e.key===' ')&&!running)startLevel(nextLvl);
});
cv.addEventListener('pointerdown',function(e){      // tap left half = left, right half = right
 var r=cv.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1);
});

/* ================= 6. TRAFFIC ================= */
function pickType(){                              // random traffic type using weights
 var r=Math.random()*100,s=0;
 for(var i=0;i<TRAFFIC.length;i++){s+=TRAFFIC[i].weight;if(r<s)return TRAFFIC[i]}
 return TRAFFIC[0];
}
function spawn(){
 var n=Math.random()<0.2+LVL*0.04?2:1, used=[];   // sometimes 2 vehicles side by side, never 3
 for(var i=0;i<n;i++){
  var l;do{l=Math.floor(Math.random()*LANES)}while(used.indexOf(l)>-1);
  used.push(l);
  var t=pickType();
  cars.push({l:l,y:-t.h-10,w:t.w,h:t.h,kind:t.kind,
   c:t.kind==='auto'?'#ffd23f':t.kind==='bus'?'#e63946':CARCOLORS[Math.floor(Math.random()*CARCOLORS.length)],
   v:speed*(t.slow[0]+Math.random()*(t.slow[1]-t.slow[0])),passed:false});
 }
}
function pop(t,x,y,c){pops.push({t:t,x:x,y:y,c:c,a:50})}   // floating "+10" text

/* ================= 7. DRAWING ================= */
function rr(x,y,w,h,r,f){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=f;ctx.fill()}
function drawTraffic(c){
 var x=laneX(c.l)-c.w/2,y=c.y;
 rr(x,y,c.w,c.h,8,c.c);
 if(c.kind==='bus'){for(var k=0;k<4;k++)rr(x+5,y+12+k*26,c.w-10,16,3,'#120f24')}
 else if(c.kind==='auto'){rr(x+3,y+4,c.w-6,22,6,'#1d7a3a');rr(x+5,y+30,c.w-10,12,3,'#120f2488')}
 else{rr(x+5,y+14,c.w-10,18,4,'#120f24');rr(x+5,y+44,c.w-10,14,4,'#120f2488')}
 rr(x+3,y+c.h-8,9,5,2,'#ffefb0');rr(x+c.w-12,y+c.h-8,9,5,2,'#ffefb0');   // lights
}
function drawPlayer(){
 var v=cur();
 ctx.save();ctx.translate(px,BY+40);ctx.rotate(lean*(v.kind==='bike'?1:0.4));
 var g=ctx.createLinearGradient(0,-300,0,0);g.addColorStop(0,'#ffb62700');g.addColorStop(1,'#ffb62744');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-10,-30);ctx.lineTo(-48,-300);ctx.lineTo(48,-300);ctx.lineTo(10,-30);ctx.fill(); // headlight beam
 if(v.kind==='bike'){
  rr(-5,-40,10,80,5,'#f4efe6');            // wheels line
  rr(-12,-24,24,34,8,v.color);             // fuel tank in vehicle colour
  rr(-20,-30,40,6,3,'#f4efe6');            // handlebar
  ctx.beginPath();ctx.arc(0,-8,8,0,7);ctx.fillStyle='#ffb627';ctx.fill(); // rider helmet
  rr(-4,34,8,6,2,'#ff3d7f');               // tail light
 }else{
  rr(-19,-38,38,80,10,v.color);            // car body
  rr(-14,-20,28,16,4,'#120f24');           // windscreen
  rr(-14,8,28,12,4,'#120f2488');           // rear window
  rr(-17,38,10,5,2,'#ff3d7f');rr(7,38,10,5,2,'#ff3d7f'); // tail lights
 }
 ctx.restore();
}
function draw(){
 ctx.fillStyle='#1c1838';ctx.fillRect(0,0,W,H);                         // road
 ctx.fillStyle='#120f24';ctx.fillRect(0,0,RX-6,H);ctx.fillRect(RX+RW+6,0,RX-6,H); // roadside
 ctx.fillStyle='#ffb627';ctx.fillRect(RX-6,0,6,H);ctx.fillRect(RX+RW,0,6,H);      // edge lines
 ctx.fillStyle='#f4efe655';
 for(var l=1;l<LANES;l++)for(var y=-60+off;y<H;y+=60)ctx.fillRect(RX+LW*l-2,y,4,30); // lane dashes
 var L=trackLen(LVL),left=(L-dist/PXM)*PXM,fy=BY+40-left;                // finish line
 if(fy>-30&&fy<H){for(var k=0;k<LANES*2;k++)for(var r=0;r<2;r++){ctx.fillStyle=(k+r)%2?'#f4efe6':'#120f24';ctx.fillRect(RX+k*LW/2,fy+r*14,LW/2,14)}}
 for(var i=0;i<cars.length;i++)drawTraffic(cars[i]);
 drawPlayer();
 ctx.font='bold 16px Bungee,Impact,sans-serif';ctx.textAlign='center';
 for(var j=0;j<pops.length;j++){ctx.globalAlpha=Math.min(1,pops[j].a/30);ctx.fillStyle=pops[j].c;ctx.fillText(pops[j].t,pops[j].x,pops[j].y)}
 ctx.globalAlpha=1;
 var pr=Math.min(1,dist/PXM/L);                                          // progress bar
 ctx.fillStyle='#f4efe622';ctx.fillRect(16,56,W-32,6);ctx.fillStyle='#ffb627';ctx.fillRect(16,56,(W-32)*pr,6);
 ctx.fillStyle='#f4efe6';ctx.font='11px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(Math.floor(pr*L)+' / '+L+' m',16,76);
}

/* ================= 8. GAME LOOP ================= */
function update(){
 var L=trackLen(LVL),m=dist/PXM,base=4+0.5*LVL,max=Math.min(12,7+LVL*0.7);
 speed=base+(max-base)*Math.min(1,m/L);          // speed rises through the level
 dist+=speed;off=(off+speed)%60;
 if(m>=L){win();return}
 spawnT-=speed;
 if(spawnT<=0){spawn();spawnT=Math.max(110,210-LVL*14)+Math.random()*100-speed*5}
 var tx=laneX(lane);px+=(tx-px)*0.22;lean=(tx-px)*0.012;   // smooth lane change + lean
 for(var i=cars.length-1;i>=0;i--){
  var c=cars[i];c.y+=speed-c.v;
  if(c.y>H+20){cars.splice(i,1);continue}
  if(!c.passed&&c.y>BY+40){                       // overtaken!
   c.passed=true;combo++;
   var close=Math.abs(c.l-lane)===1;              // passed while in the next lane = close call
   var gain=10+(close?5:0)+Math.min(combo,10);
   pts+=gain;pop('+'+gain+(close?' close':''),laneX(c.l),BY+20,close?'#ffb627':'#f4efe6');
  }
  if(Math.abs(laneX(c.l)-px)<(cur().hw+c.w/2-6)&&c.y+c.h>BY&&c.y<BY+80){crash();return} // crash check
 }
 for(var j=pops.length-1;j>=0;j--){pops[j].a--;pops[j].y-=0.8;if(pops[j].a<=0)pops.splice(j,1)}
 sc.textContent=total+pts;
}
function loop(){if(running)update();draw();requestAnimationFrame(loop)}

go.textContent='Start level '+unlocked;
buildGarage();reset();loop();
})();
</script>
</body>
</html>
